
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | CoopRecicla</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        .senha-container {
            position: relative;
            width: 100%;
        }

        .senha-container input {
            width: 100%;
            padding-right: 85px;
        }

        .btn-mostrar-senha {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--verde-profundo);
            cursor: pointer;
            font-weight: bold;
        }

        .forca-senha {
            width: 100%;
            height: 7px;
            background: #ddd;
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }

        #barraForca {
            height: 100%;
            width: 0;
            transition: width 0.3s;
            border-radius: 10px;
        }

        #textoForca,
        #textoConfirmacao,
        #requisitosSenha {
            font-size: 0.78rem;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>

<body class="auth-layout">

    <div class="auth-container">

        <div class="auth-header">

            <div class="logo">
                <div class="logo-icon">♻️</div>

                <div>
                    <h1 style="color: var(--verde-profundo);">
                        Coop<span style="color: var(--verde-vibrante);">Recicla</span>
                    </h1>

                    <small style="color: var(--texto-secundario);">
                        Cooperativa de Reciclagem
                    </small>
                </div>
            </div>

            <div style="text-align: right;">
                <h2>Criar Conta</h2>
                <span style="font-size: 0.85rem; color: var(--texto-secundario);">
                    Rede de coleta seletiva
                </span>
            </div>

        </div>

        <form id="formCadastro">

            <!-- Cadastro público somente para moradores -->
            <div class="campo">
                <label>Tipo de Cadastro</label>

                <div class="perfil-selector">
                    <label class="perfil-option">
                        🏠 Morador (Coleta e Pontos)
                    </label>
                </div>
            </div>

            <div class="grid-form">

                <div class="campo full">
                    <label for="nome">
                        Nome Completo <span class="obrigatorio">*</span>
                    </label>

                    <input type="text" id="nome" name="nome"
                        maxlength="100" minlength="3" required
                        placeholder="Ex: Maria da Silva">
                </div>

                <div class="campo">
                    <label for="cpf">
                        CPF <span class="obrigatorio">*</span>
                    </label>

                    <input type="text" id="cpf" name="cpf"
                        maxlength="14" required
                        placeholder="000.000.000-00">
                </div>

                <div class="campo">
                    <label for="tel">
                        Telefone <span class="obrigatorio">*</span>
                    </label>

                    <input type="tel" id="tel" name="tel"
                        maxlength="15" required
                        placeholder="(82) 99999-9999">
                </div>

                <div class="campo full">
                    <label for="email">
                        E-mail <span class="obrigatorio">*</span>
                    </label>

                    <input type="email" id="email" name="email"
                        maxlength="50" required
                        placeholder="seuemail@exemplo.com">
                </div>

                <div class="campo">

                    <label for="senha">
                        Criar Senha <span class="obrigatorio">*</span>
                    </label>

                    <div class="senha-container">
                        <input type="password" id="senha" name="senha"
                            minlength="8" maxlength="8" required
                            autocomplete="new-password"
                            placeholder="Crie uma senha">

                        <button type="button" class="btn-mostrar-senha"
                            onclick="alternarVisibilidade('senha', this)">
                            Mostrar
                        </button>
                    </div>

                    <small id="requisitosSenha">
                        Exatamente 8 caracteres, com maiúscula,
                        minúscula, número e símbolo.
                    </small>

                    <div class="forca-senha">
                        <div id="barraForca"></div>
                    </div>

                    <small id="textoForca"></small>

                </div>

                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar Senha <span class="obrigatorio">*</span>
                    </label>

                    <div class="senha-container">
                        <input type="password" id="confirmarSenha"
                            minlength="8" maxlength="8" required
                            autocomplete="new-password"
                            placeholder="Repita sua senha">

                        <button type="button" class="btn-mostrar-senha"
                            onclick="alternarVisibilidade('confirmarSenha', this)">
                            Mostrar
                        </button>
                    </div>

                    <small id="textoConfirmacao"></small>

                </div>

                <div class="campo full" id="grupoEndereco">

                    <label for="endereco">
                        Endereço Residencial <span class="obrigatorio">*</span>
                    </label>

                    <input type="text" id="endereco" name="endereco"
                        maxlength="100" required
                        placeholder="Rua, número, bairro e cidade">

                </div>

            </div>

            <div style="display: flex; align-items: center; gap: 10px; margin: 16px 0 24px; font-size: 0.88rem;">

                <input type="checkbox" id="termos" required
                    style="width: 17px; height: 17px; accent-color: var(--verde-escuro);">

                <label for="termos" style="font-weight: 400;">
                    Aceito os termos de uso e a política de privacidade da cooperativa.
                </label>

            </div>

            <div style="display: flex; gap: 12px; justify-content: center;">
                <button type="submit" class="btn-primario">
                    Concluir Cadastro
                </button>
            </div>

        </form>

        <div class="auth-footer">
            Juntos por uma cidade mais limpa e sustentável 🌱
        </div>

    </div>

    <script>
        const senhaInput = document.getElementById("senha");
        const confirmarInput = document.getElementById("confirmarSenha");

        function alternarVisibilidade(id, botao) {
            const campo = document.getElementById(id);

            if (campo.type === "password") {
                campo.type = "text";
                botao.textContent = "Ocultar";
            } else {
                campo.type = "password";
                botao.textContent = "Mostrar";
            }
        }

        function senhaValida(senha) {
            return senha.length === 8 &&
                /[A-Z]/.test(senha) &&
                /[a-z]/.test(senha) &&
                /[0-9]/.test(senha) &&
                /[^A-Za-z0-9]/.test(senha);
        }

        senhaInput.addEventListener("input", function () {
            const senha = this.value;
            let pontos = 0;

            if (senha.length === 8) pontos++;
            if (/[A-Z]/.test(senha)) pontos++;
            if (/[a-z]/.test(senha)) pontos++;
            if (/[0-9]/.test(senha)) pontos++;
            if (/[^A-Za-z0-9]/.test(senha)) pontos++;

            const barra = document.getElementById("barraForca");
            const texto = document.getElementById("textoForca");

            const niveis = [
                { largura: "0%", mensagem: "", cor: "" },
                { largura: "20%", mensagem: "Muito fraca", cor: "#dc3545" },
                { largura: "40%", mensagem: "Fraca", cor: "#fd7e14" },
                { largura: "60%", mensagem: "Razoável", cor: "#ffc107" },
                { largura: "80%", mensagem: "Boa", cor: "#20a66a" },
                { largura: "100%", mensagem: "Forte", cor: "#198754" }
            ];

            barra.style.width = niveis[pontos].largura;
            barra.style.backgroundColor = niveis[pontos].cor;
            texto.textContent = niveis[pontos].mensagem;

            validarConfirmacao();
        });

        function validarConfirmacao() {
            const texto = document.getElementById("textoConfirmacao");

            if (!confirmarInput.value) {
                texto.textContent = "";
                confirmarInput.setCustomValidity("");
                return;
            }

            if (senhaInput.value === confirmarInput.value) {
                texto.textContent = "As senhas coincidem.";
                texto.style.color = "green";
                confirmarInput.setCustomValidity("");
            } else {
                texto.textContent = "As senhas não coincidem.";
                texto.style.color = "red";
                confirmarInput.setCustomValidity("As senhas não coincidem.");
            }
        }

        confirmarInput.addEventListener("input", validarConfirmacao);

        document.getElementById("cpf").addEventListener("input", function () {
            let v = this.value.replace(/\D/g, "").slice(0, 11);

            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

            this.value = v;
        });

        document.getElementById("tel").addEventListener("input", function () {
            let v = this.value.replace(/\D/g, "").slice(0, 11);

            if (v.length > 10) {
                v = v.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
            } else if (v.length > 6) {
                v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3");
            } else if (v.length > 2) {
                v = v.replace(/(\d{2})(\d+)/, "($1) $2");
            }

            this.value = v;
        });

        function validarCPF(cpf) {
            return cpf.replace(/\D/g, "").length === 11;
        }

        document.getElementById("formCadastro").addEventListener("submit", async function (event) {
            event.preventDefault();

            const cpfInput = document.getElementById("cpf");

            if (!validarCPF(cpfInput.value)) {
                alert("O CPF deve conter exatamente 11 dígitos.");
                cpfInput.focus();
                return;
            }

            if (!senhaValida(senhaInput.value)) {
                alert("A senha deve ter exatamente 8 caracteres, com maiúscula, minúscula, número e símbolo.");
                senhaInput.focus();
                return;
            }

            if (senhaInput.value !== confirmarInput.value) {
                alert("As senhas não coincidem.");
                confirmarInput.focus();
                return;
            }

            const dados = {
                nome: document.getElementById("nome").value.trim(),
                cpf: cpfInput.value.replace(/\D/g, ""),
                tel: document.getElementById("tel").value.replace(/\D/g, ""),
                email: document.getElementById("email").value.trim(),
                senha: senhaInput.value,
                endereco: document.getElementById("endereco").value.trim(),

                // O cadastro público sempre envia MORADOR
                tipo_usuario: "MORADOR"
            };

            try {
                const resposta = await fetch("http://localhost:3000/usuarios", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dados)
                });

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    alert(resultado.mensagem || "Não foi possível realizar o cadastro.");
                    return;
                }

                alert("Cadastro de morador realizado com sucesso!");
                window.location.href = "login.html";

            } catch (erro) {
                console.error(erro);
                alert("Não foi possível conectar ao servidor.");
            }
        });
    </script>

</body>
</html>
