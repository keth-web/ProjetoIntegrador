
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Pessoa | CoopRecicla</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .form-edicao {
      max-width: 650px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border: 1px solid #398B68;
      border-radius: 15px;
      box-shadow: 0 5px 20px #00000012;
    }

    .form-edicao .campo {
      margin-bottom: 15px;
    }

    .form-edicao input:not([type="checkbox"]) {
      width: 100%;
      padding: 12px;
      border: 1px solid #398B68;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .form-edicao input[readonly] {
      background: #eee;
    }

    .opcao-adm {
      background: #eaf5ed;
      padding: 18px;
      border-radius: 10px;
      margin: 20px 0;
    }

    .opcao-adm label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .opcao-adm input {
      width: auto;
    }

    .acoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mensagem {
      margin-top: 15px;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-icon">♻️</div>
    <h1>Coop<span>Recicla</span></h1>
  </div>
</header>

<main>
  <div class="form-edicao">

    <h2>Editar Pessoa Cadastrada</h2>
    <p class="subtitulo-secao">Atualize os dados do usuário.</p>

    <form id="formEdicao">

      <div class="campo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" readonly>
      </div>

      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" maxlength="100" required>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" maxlength="50" required>
      </div>

      <div class="campo">
        <label for="tel">Telefone</label>
        <input type="text" id="tel" maxlength="11"
          inputmode="numeric" required>
      </div>

      <div class="campo">
        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" maxlength="100" required>
      </div>

      <div class="opcao-adm">
        <label>
          <input type="checkbox" id="tornarAdm">
          Transformar este morador em Administrador (ADM)
        </label>

        <small>
          Ao confirmar, o usuário receberá o perfil de administrador ativo.
        </small>
      </div>

      <div class="acoes">
        <button type="submit" class="btn-primario" id="btnSalvar">
          Salvar alterações
        </button>

        <button type="button" class="btn-secundario"
          onclick="window.location.href='painel-adm.html'">
          Voltar
        </button>
      </div>

      <p id="mensagem" class="mensagem"></p>

    </form>
  </div>
</main>

<script>
  const API = 'http://localhost:3000';

  const form = document.getElementById('formEdicao');
  const mensagem = document.getElementById('mensagem');
  const btnSalvar = document.getElementById('btnSalvar');

  const parametros = new URLSearchParams(window.location.search);
  const cpf = (parametros.get('cpf') || '').replace(/\D/g, '');

  const adminCpf = localStorage.getItem('usuario_cpf');
  const perfil = localStorage.getItem('usuario_perfil');

  function mostrarMensagem(texto, cor = 'red') {
    mensagem.textContent = texto;
    mensagem.style.color = cor;
  }

  async function carregarPessoa() {
    try {
      mostrarMensagem('Carregando dados...', '#398B68');

      const resposta = await fetch(
        `${API}/moradores/${encodeURIComponent(cpf)}?adminCpf=${encodeURIComponent(adminCpf)}`
      );

      const dados = await resposta.json();

      if (!resposta.ok) {
        throw new Error(
          dados.mensagem || 'Não foi possível carregar o cadastro.'
        );
      }

      document.getElementById('cpf').value = cpf;
      document.getElementById('nome').value = dados.nome || '';
      document.getElementById('email').value = dados.email || '';
      document.getElementById('tel').value = dados.tel || '';
      document.getElementById('endereco').value = dados.endereco || '';

      mostrarMensagem('Dados carregados com sucesso!', 'green');

    } catch (erro) {
      mostrarMensagem(erro.message);
    }
  }

  async function inicializar() {
    if (perfil !== 'ADM' || !adminCpf) {
      alert('Acesso permitido somente para administradores.');
      window.location.href = 'login.html';
      return;
    }

    if (cpf.length !== 11) {
      alert('CPF não informado ou inválido. Volte ao painel e selecione uma pessoa.');
      window.location.href = 'painel-adm.html';
      return;
    }

    document.getElementById('cpf').value = cpf;

    await carregarPessoa();
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    if (cpf.length !== 11) {
      mostrarMensagem('CPF inválido.');
      return;
    }

    const promover = document.getElementById('tornarAdm').checked;

    if (promover) {
      const confirmar = confirm(
        'Deseja realmente transformar este morador em administrador?'
      );

      if (!confirmar) return;
    }

    const dados = {
      adminCpf: adminCpf,
      nome: document.getElementById('nome').value.trim(),
      email: document.getElementById('email').value.trim(),
      tel: document.getElementById('tel').value.trim(),
      endereco: document.getElementById('endereco').value.trim()
    };

    btnSalvar.disabled = true;
    btnSalvar.textContent = 'Salvando...';

    try {
      const respostaEdicao = await fetch(
        `${API}/moradores/${encodeURIComponent(cpf)}`,
        {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(dados)
        }
      );

      const resultadoEdicao = await respostaEdicao.json();

      if (!respostaEdicao.ok) {
        throw new Error(
          resultadoEdicao.mensagem || 'Erro ao salvar alterações.'
        );
      }

      if (promover) {
        const respostaPromocao = await fetch(
          `${API}/administradores/promover`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              adminCpf: adminCpf,
              cpf: cpf
            })
          }
        );

        const resultadoPromocao = await respostaPromocao.json();

        if (!respostaPromocao.ok) {
          throw new Error(
            resultadoPromocao.mensagem || 'Erro ao promover usuário.'
          );
        }
      }

      mostrarMensagem(
        promover
          ? 'Cadastro atualizado e usuário promovido a ADM!'
          : 'Cadastro atualizado com sucesso!',
        'green'
      );

      document.getElementById('tornarAdm').checked = false;

    } catch (erro) {
      mostrarMensagem(erro.message);
    } finally {
      btnSalvar.disabled = false;
      btnSalvar.textContent = 'Salvar alterações';
    }
  });

  inicializar();
</script>

</body>
</html>
